services:
  db:
    image: mongo:8
    command: --replSet rs0 --bind_ip_all
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: 
      context: ../DevFlow
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://db:27017/devflow?directConnection=true
      - NEXTAUTH_SECRET=ваш_секрет_из_env
      - AUTH_SECRET=ваш_секрет_из_env
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=https://devflow.localhost
      - AUTH_URL=https://devflow.localhost
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo_data: